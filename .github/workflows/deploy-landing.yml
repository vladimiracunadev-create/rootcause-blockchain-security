# ─────────────────────────────────────────────────────────────────────────────
# Deploy Landing Page — RootCause Blockchain Security
#
# Publica la pagina de producto en GitHub Pages, con el mismo esquema que el
# resto de la familia RootCause.
#
# Dos detalles propios de este repositorio:
#
#   1. El sitio se ENSAMBLA, no se sube tal cual: las capturas del producto
#      viven una sola vez en docs/img (donde las usa el README) y se copian
#      aqui al construir. Versionarlas dos veces seria pedirle a git que
#      guarde 780 KB de PNG duplicados en cada cambio de captura.
#
#   2. Antes de publicar se verifica que la pagina no referencia ninguna
#      imagen que no exista. Una landing con un hueco gris es peor que no
#      tener landing: es la primera impresion del producto.
#
#   3. Aqui se GENERA la muestra del producto (diapositivas y pauta del
#      expositor) desde docs/presentacion.md. Los PDF no se versionan: pesan
#      cerca de dos megas y se rehacen enteros en cada cambio del guion. Se
#      construyen, se verifican contra lo que anuncia el README y se publican
#      en site/presentacion/.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "docs/img/**"
      - "docs/presentacion.md"
      - "scripts/build-presentation.js"
      - "scripts/render-presentation-pdf.js"
      - "scripts/check-presentation.js"
      - "scripts/lib/**"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar en GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Node LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Las diapositivas y la pauta salen de docs/presentacion.md. El paso
      # ejecuta ademas las pruebas y los dos comandos de la demo, porque las
      # cifras y la salida que proyecta la lamina son las reales, no una
      # transcripcion. Los PDF los imprime el Chrome del runner por el
      # protocolo DevTools: ni aqui hay dependencias npm.
      - name: Generar la presentacion y la pauta del expositor
        run: |
          node scripts/build-presentation.js
          node scripts/render-presentation-pdf.js

      # Un README que anuncia siete laminas y una presentacion que trae ocho es
      # el fallo que nadie ve hasta que alguien tiene que exponer.
      - name: Comprobar que coincide con lo que anuncia el README
        run: node scripts/check-presentation.js

      - name: Ensamblar el sitio
        run: |
          mkdir -p site
          cp -r landing/. site/
          mkdir -p site/img
          cp docs/img/*.png site/img/
          mkdir -p site/presentacion
          cp presentacion/presentacion.html presentacion/pauta.html site/presentacion/
          cp presentacion/PRESENTACION.pdf presentacion/PAUTA.pdf site/presentacion/
          echo "  archivos publicados:"
          find site -type f | sort | sed 's/^/    /'

      # La landing enlaza los dos PDF de la muestra. Un enlace de descarga roto
      # en la pagina de producto se descubre siempre en el peor momento.
      - name: Verificar que la muestra llego completa al sitio
        run: |
          for f in site/presentacion/PRESENTACION.pdf site/presentacion/PAUTA.pdf \
                   site/presentacion/presentacion.html; do
            if [ ! -s "$f" ]; then
              echo "  FALTA o esta vacio: $f"
              exit 1
            fi
            echo "  ok: $f ($(du -h "$f" | cut -f1))"
          done
          missing=0
          for ref in $(grep -oE 'href="presentacion/[^"]+"' site/index.html | sed 's/href="//; s/"//'); do
            if [ ! -f "site/$ref" ]; then
              echo "  FALTA el destino enlazado por la landing: $ref"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # Una imagen rota en la pagina de producto es la primera impresion del
      # proyecto. Se comprueba antes de publicar, no despues.
      - name: Verificar que no hay imagenes rotas
        run: |
          missing=0
          for ref in $(grep -oE 'src="[^"]+\.(png|svg|jpg)"' site/index.html | sed 's/src="//; s/"//'); do
            case "$ref" in
              http*) continue ;;
            esac
            if [ ! -f "site/$ref" ]; then
              echo "  FALTA: $ref"
              missing=1
            else
              echo "  ok: $ref"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "La landing referencia imagenes que no existen."
            exit 1
          fi

      # Toda imagen necesita texto alternativo: una landing que no se puede
      # leer con lector de pantalla no esta terminada.
      - name: Verificar texto alternativo en las imagenes
        run: |
          total=$(grep -oE '<img[^>]*>' site/index.html | wc -l)
          conalt=$(grep -oE '<img[^>]*alt="[^"]+"[^>]*>' site/index.html | wc -l)
          echo "  $conalt de $total imagenes con alt"
          if [ "$total" -ne "$conalt" ]; then
            echo "Hay imagenes sin texto alternativo."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
